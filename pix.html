<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Pagamento Pix | PrimeFit</title>
  <link rel="icon" href="/assets/nutrigold/favicon.svg">
  <link rel="stylesheet" href="/assets/styles-BxU50RWT.css">
  <link rel="stylesheet" href="/assets/nutrigold/theme.css">
  <link rel="stylesheet" href="/assets/nutrigold/checkout.css">
  <link rel="stylesheet" href="/assets/nutrigold/pix.css">
  <script src="/assets/nutrigold/pix.js" defer></script>
</head>
<body class="ng-checkout ng-checkout-steps">
  <header class="ng-checkout-header">
    <a class="ng-logo" href="/">Prime<span>Fit</span></a>
  </header>
  <main class="ng-checkout-flow pix-page">
    <section class="ng-step-card">
      <h1>Pagamento via Pix</h1>
      <p id="pix-status" role="status">Carregando pagamento…</p>
      <div id="pix-details" hidden>
        <p id="pix-amount"></p>
        <p id="pix-expiration"></p>
        <img id="pix-qr" alt="QR Code para pagar o pedido via Pix" width="280" height="280">
        <label for="pix-code">Pix copia e cola</label>
        <textarea id="pix-code" readonly rows="3"></textarea>
        <button class="btn-primary w-full" type="button" id="pix-copy">Copiar código Pix</button>
        <p id="copy-status" role="status"></p>
        <h2>Como pagar</h2>
        <ol>
          <li>Abra o aplicativo do seu banco e escolha Pix.</li>
          <li>Escaneie o QR Code ou cole o código na opção Pix Copia e Cola.</li>
          <li>Confira o valor e o recebedor, depois confirme no aplicativo do banco.</li>
        </ol>
        <button class="step-back" type="button" id="pix-refresh">Verificar pagamento</button>
      </div>
      <a class="step-back" href="/checkout.html">Voltar ao checkout</a>
    </section>
  </main>
</body>
</html>
